name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `tests/ffi_c_example.rs` links `examples/ffi/demo.c` against a real
      # static library, which is the only check that `src/ffi/reticle.h`
      # describes the symbols a C compiler actually finds. Cargo does not
      # build a staticlib during `cargo test`, and a nested cargo would
      # block on the same lock, so it is built here; without it that test
      # skips with a message.
      - name: Static library for the C example
        run: cargo rustc --lib --all-features --crate-type staticlib

      - name: Test (all features)
        run: cargo test --all-features

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Every stage must build on its own: a module that quietly depends on
      # another feature's types breaks the lean builds a consumer asks for.
      # `--all-targets` matters here, since an unguarded integration test is
      # the usual way this regresses.
      - name: Each feature alone
        run: |
          set -e
          for f in "" verilog vhdl sim synth formal fpga asic timing ip lsp cache viewer ffi wasm cli; do
            echo "::group::features=${f:-none}"
            if [ -z "$f" ]; then
              cargo clippy --no-default-features --all-targets -- -D warnings
            else
              cargo clippy --no-default-features --features "$f" --all-targets -- -D warnings
            fi
            echo "::endgroup::"
          done

      - name: Tests without default features
        run: cargo test --no-default-features

      - name: MSRV
        run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 check --all-features

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The browser playground in `web/` is only useful if the library
      # keeps compiling for the browser; nothing else in CI would catch a
      # 32-bit or filesystem assumption creeping back in. See docs/wasm.md.
      - name: Build for wasm32-unknown-unknown
        run: |
          cargo rustc --lib --target wasm32-unknown-unknown --release \
            --no-default-features --features wasm,verilog,vhdl,sim,synth \
            --crate-type cdylib

      - name: Report the module size
        run: ls -l target/wasm32-unknown-unknown/release/reticle.wasm

  package:
    name: Publishable crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # release-plz publishes from master, so a crate that does not package
      # or does not build once packaged must fail here rather than at
      # release time. `cargo package` compiles the packaged copy, which also
      # catches a source file left out by the `exclude` list.
      - name: Package and verify
        run: cargo package

      - name: Report the crate size
        run: ls -lh target/package/*.crate
