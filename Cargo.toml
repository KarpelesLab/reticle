[package]
name = "reticle"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
description = "A from-scratch VHDL / Verilog compiler in pure Rust: frontends, a unified IR, simulation, synthesis and FPGA/ASIC backends, with first-class IP integration."
repository = "https://github.com/KarpelesLab/reticle"
license = "MIT"
keywords = ["vhdl", "verilog", "fpga", "hdl", "synthesis"]
categories = ["compilers", "hardware-support", "simulation", "development-tools"]
# Keep the published .crate small: CI config and large test corpora stay out.
# `/ip` is the Reticle IP library — HDL packages, not Rust. Nothing under
# `src/` reads it (the library is sans-I/O and the blocks reach a design
# through `ip::resolve` like any other package), only `tests/ip_library.rs`
# does, so shipping it would add a tree of `.v` files to every download of
# the crate without making the crate do anything more. It is published as
# part of the repository instead; see `docs/ip-library.md`. The leading
# slash anchors the pattern to the package root: `ip` alone would also
# match `src/ip/`, which is Rust and has to ship.
exclude = [
    ".github",
    "/ip",
    "testdata/corpus",
    # The browser playground and the C example are documentation, not crate
    # sources: `web/` is a hand-written `.js` wrapper plus an `.html` page
    # that only mean anything next to a `.wasm` the consumer builds, and
    # `examples/ffi/` is C. Neither is reachable from `src/`, so shipping
    # them would only grow every download. They live in the repository;
    # see `docs/wasm.md` and `docs/ffi.md`.
    "/web",
    "/examples",
]

# `examples/ffi/` holds C, not Rust. Cargo's example auto-discovery would
# otherwise look for a target there.
autoexamples = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "reticle"

[features]
# Every stage is a feature so a consumer (or a WebAssembly playground) can
# compile in only what it needs: a lint-only build wants a frontend and no
# synthesis, a simulator-only build wants no technology mapping, and so on.
# The dependency arrows below mirror the pipeline in ROADMAP.md.
default = ["verilog", "vhdl", "sim", "synth", "cli"]

# --- frontends: source text -> AST -> elaborated design -> IR ---
# Verilog-2005 plus the synthesisable SystemVerilog subset (IEEE 1800).
verilog = []
# VHDL-2008 (IEEE 1076), with VHDL-93 compatibility.
vhdl = []

# --- middle: passes over the unified IR ---
# Event-driven 4-state simulator, waveform dumps (VCD/FST), co-simulation API.
sim = []
# Technology-independent synthesis: process lowering, FSM/memory/FF inference,
# logic optimisation, cellification, plus generic LUT and cell mapping.
# With `formal` also on, `synth::verify` adds the post-synthesis
# equivalence check (`SynthOptions::verify_equivalence`); the dependency is
# deliberately not declared here so a synthesis-only build stays lean.
synth = []

# --- backends & targets (land as they are implemented, see ROADMAP.md) ---
# FPGA device databases, bitstream-oriented flows and vendor interop.
fpga = ["synth"]
# Liberty / LEF / DEF handling and standard-cell mapping.
asic = ["synth"]

# --- analysis over a mapped netlist ---
# Static timing analysis and clock domain crossing analysis. The graph,
# the delay models and the analyses need nothing but the IR, so this is an
# empty feature: with `asic` also on it gains a Liberty delay model, and
# with `fpga` also on it reads clocks and path exceptions straight from a
# `Constraints` value. See `docs/timing.md`.
timing = []

# IP integration: the IP and project manifest formats, dependency
# resolution and the lock file, bus interface abstractions, interconnect
# generators and black-box handling for encrypted vendor cores. It needs
# both frontends because a project's sources and its dependencies' sources
# are dispatched by extension and may be in either language.
ip = ["verilog", "vhdl"]

# --- embedding ---
# The C ABI in `src/ffi`: opaque handles over the frontends, the IR, the
# simulator and synthesis, for a tool written in another language. It is
# the one module allowed to use `unsafe` (see `src/lib.rs`). Every entry
# point is exported unconditionally so `src/ffi/reticle.h` describes one
# fixed ABI; a call into a stage that was not compiled in returns
# `RETICLE_ERR_UNSUPPORTED` rather than vanishing from the symbol table.
# See `docs/ffi.md`.
ffi = []
# The WebAssembly surface in `src/wasm`: the same operations as the C API,
# exported as plain `extern "C"` functions over linear memory with an
# allocator pair, so no bindgen is needed. `web/reticle.js` wraps them.
# See `docs/wasm.md`.
wasm = []

# Incremental compilation: a content-addressed cache of elaborated (and
# synthesised) modules, keyed on the source text and options that produced
# them, so a re-run after a small edit only redoes what changed. The store
# is sans-I/O like the rest of the library: the in-memory backend ships
# here and the CLI supplies a directory-backed one. It needs no other
# feature to compile; with `verilog`, `vhdl` or `synth` also on it caches
# those stages' output. See `docs/cache.md`.
cache = []

# --- talking to a board ---
# Programming a real FPGA over USB, and the `reticle program` command that
# drives it. `src/program` holds the FTDI MPSSE command encoding (AN_108),
# the IEEE 1149.1 TAP state machine and the Xilinx 7-series JTAG
# configuration sequence (UG470) as pure byte-shuffling, plus the thin USB
# transport that carries it. See `docs/programming.md`.
#
# **This is the one feature with a dependency, which is why it is off by
# default**: `cargo add reticle` has to stay dependency-free for everyone
# who compiles a design and never touches a cable, and `cli` deliberately
# does *not* imply it, so the stock binary is dependency-free too. What it
# adds is one crate and no transitive tree: `rawusb` is a sibling Karpeles
# Lab crate (MIT, edition 2024, MSRV 1.89) with no dependencies of its
# own. It is also what keeps `unsafe_code = "deny"` true here — the ioctls
# live in `rawusb`'s `src/sys/`, and `src/program` stays safe.
program = ["dep:rawusb"]

# --- verification & tooling ---
# Formal: bounded model checking and equivalence checking over the IR, built
# on an in-crate SAT solver.
formal = []
# Language server (LSP) over the frontends: JSON-RPC over the LSP base
# protocol, a document store, and diagnostics, go-to-definition, hover,
# symbols, completion, rename, references and formatting for both
# languages. It drives the two frontends (and their formatters and the
# Verilog linter) directly, so it needs both. See `docs/lsp.md`.
lsp = ["verilog", "vhdl"]

# Schematic and documentation viewer: renders a design as a set of
# self-contained HTML pages (inline SVG schematics, per-module reference
# pages, an index). It reads nothing but the IR and a `SourceMap`, so it is
# an empty feature; with `verilog` or `vhdl` also on, `viewer::Comments`
# gains the constructors that read those lexers' comment side tables.
# See `docs/viewer.md`.
viewer = []

# The `reticle` command-line tool (gates the binary target below). It drives
# every stage, so it turns them all on, including `formal` which is otherwise
# off by default.
cli = ["verilog", "vhdl", "sim", "synth", "formal", "fpga", "timing", "ip", "lsp", "cache", "viewer", "asic"]

# --- dependencies ---
# Reticle is written from scratch and ships no foreign code: hand-written
# lexers/parsers, an in-house IR, simulator, SAT solver and file-format codecs.
# The CLI parses its own arguments. This keeps the whole toolchain auditable,
# trivially cross-compilable (including to WebAssembly), and free of version
# churn from upstream crates. Any exception must be a sibling Karpeles Lab
# crate and must be justified here, as purecrypto does for `compcol`.
#
# There is exactly one exception, and it is optional: `rawusb`, behind the
# `program` feature. Configuring a real board means speaking USB, which no
# amount of from-scratch code can do without the operating system; `rawusb`
# is the Karpeles Lab crate that does it (MIT, no dependencies of its own,
# edition 2024, MSRV 1.89, the same as this crate). Keeping it optional
# means a default build still resolves to zero dependencies.
[dependencies]
rawusb = { version = "0.1.1", optional = true }

[dev-dependencies]

[[bin]]
name = "reticle"
path = "src/bin/reticle/main.rs"
required-features = ["cli"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
# Deny, not forbid: the crate has exactly one module that must opt back
# in, `src/ffi` (and `src/wasm`, which is the same boundary in another
# shape). A C ABI cannot be expressed without raw pointers, and `forbid`
# cannot be overridden even locally, so the level is `deny` and the two
# boundary modules carry a scoped `#![allow(unsafe_code)]` with the
# invariant for every block written next to it. Nothing else in the crate
# may opt in; a compiler has no business touching raw memory.
unsafe_code = "deny"

[lints.clippy]
# Hardware descriptions are full of bit widths and shift amounts; make lossy
# integer conversions explicit so a `u64 as u32` on a width is never silent.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
