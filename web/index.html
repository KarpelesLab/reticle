<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reticle playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1d;
        --muted: #5c5c66;
        --line: #d8d8e0;
        --panel: #f6f6f8;
        --error: #b3261e;
        --warning: #8a6100;
        --note: #2d5c9e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #e6e6ea;
          --muted: #9a9aa6;
          --line: #32323c;
          --panel: #1e1e24;
          --error: #ff8a80;
          --warning: #f0c36d;
          --note: #8fb8ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      header {
        padding: 0.9rem 1.2rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }
      header h1 {
        font-size: 1.05rem;
        margin: 0 0.6rem 0 0;
        font-weight: 600;
      }
      header .meta {
        color: var(--muted);
        font-size: 0.85rem;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--line);
        height: calc(100vh - 64px);
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      section {
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 320px;
        min-width: 0;
      }
      .bar {
        padding: 0.5rem 0.8rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
      }
      .bar .grow {
        flex: 1;
      }
      button,
      select,
      input[type='file'] {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.28rem 0.7rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--note);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      textarea,
      pre {
        flex: 1;
        margin: 0;
        padding: 0.8rem;
        border: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
        overflow: auto;
        tab-size: 2;
      }
      textarea {
        resize: none;
        outline: none;
      }
      .tabs {
        display: flex;
        gap: 0.2rem;
        border-bottom: 1px solid var(--line);
        padding: 0 0.5rem;
      }
      .tabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        padding: 0.45rem 0.7rem;
        color: var(--muted);
      }
      .tabs button[aria-selected='true'] {
        color: var(--fg);
        border-bottom-color: var(--note);
      }
      .pane {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .pane[data-active='true'] {
        display: flex;
      }
      ul.diagnostics {
        list-style: none;
        margin: 0;
        padding: 0.4rem 0;
        overflow: auto;
        flex: 1;
      }
      ul.diagnostics li {
        padding: 0.4rem 0.9rem;
        border-bottom: 1px solid var(--line);
      }
      ul.diagnostics .where {
        color: var(--muted);
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .sev-error {
        color: var(--error);
        font-weight: 600;
      }
      .sev-warning {
        color: var(--warning);
        font-weight: 600;
      }
      .sev-note,
      .sev-help {
        color: var(--note);
        font-weight: 600;
      }
      .empty {
        padding: 0.9rem;
        color: var(--muted);
      }
      .loader {
        padding: 1rem 1.2rem;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .loader[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Reticle playground</h1>
      <span class="meta" id="meta">loading&hellip;</span>
    </header>

    <div class="loader" id="loader" hidden>
      <p id="loader-message"></p>
      <p>
        Pick <code>reticle.wasm</code> by hand:
        <input type="file" id="picker" accept=".wasm" />
      </p>
    </div>

    <main>
      <section>
        <div class="bar">
          <select id="language" title="Source language">
            <option value="verilog">Verilog</option>
            <option value="vhdl">VHDL</option>
          </select>
          <button id="check" disabled>Check</button>
          <button id="synth" disabled>Synthesise</button>
          <button id="emit" disabled>Emit</button>
          <select id="format" title="Output format">
            <option value="verilog">Verilog</option>
            <option value="vhdl">VHDL</option>
            <option value="json">Yosys JSON</option>
            <option value="blif">BLIF</option>
            <option value="edif">EDIF</option>
          </select>
          <span class="grow"></span>
          <button id="sample">Sample</button>
        </div>
        <textarea id="source" spellcheck="false" aria-label="Source"></textarea>
      </section>

      <section>
        <div class="tabs" role="tablist">
          <button role="tab" data-pane="diagnostics" aria-selected="true">Diagnostics</button>
          <button role="tab" data-pane="output" aria-selected="false">Output</button>
          <button role="tab" data-pane="rendered" aria-selected="false">Rendered</button>
        </div>
        <div class="pane" data-pane="diagnostics" data-active="true">
          <ul class="diagnostics" id="diagnostics"></ul>
        </div>
        <div class="pane" data-pane="output">
          <pre id="output"></pre>
        </div>
        <div class="pane" data-pane="rendered">
          <pre id="rendered"></pre>
        </div>
      </section>
    </main>

    <script type="module">
      import { Reticle } from './reticle.js';

      const SAMPLES = {
        verilog: `module counter #(parameter WIDTH = 8) (
  input                  clk,
  input                  rst,
  output reg [WIDTH-1:0] q
);
  always @(posedge clk)
    if (rst) q <= {WIDTH{1'b0}};
    else     q <= q + 1'b1;
endmodule
`,
        vhdl: `library ieee;
use ieee.std_logic_1164.all;
use ieee.numeric_std.all;

entity counter is
  port (
    clk : in  std_logic;
    rst : in  std_logic;
    q   : out std_logic_vector(7 downto 0)
  );
end entity;

architecture rtl of counter is
  signal count : unsigned(7 downto 0) := (others => '0');
begin
  process (clk) is
  begin
    if rising_edge(clk) then
      if rst = '1' then
        count <= (others => '0');
      else
        count <= count + 1;
      end if;
    end if;
  end process;
  q <= std_logic_vector(count);
end architecture;
`,
      };

      const $ = (id) => document.getElementById(id);
      const ui = {
        meta: $('meta'),
        loader: $('loader'),
        loaderMessage: $('loader-message'),
        picker: $('picker'),
        language: $('language'),
        format: $('format'),
        source: $('source'),
        diagnostics: $('diagnostics'),
        output: $('output'),
        rendered: $('rendered'),
        buttons: [$('check'), $('synth'), $('emit')],
      };

      let reticle = null;

      ui.source.value = SAMPLES.verilog;
      ui.language.addEventListener('change', () => {
        const current = ui.language.value;
        // Only replace the text when it is still an untouched sample, so
        // a switch never throws away someone's work.
        if (Object.values(SAMPLES).includes(ui.source.value)) {
          ui.source.value = SAMPLES[current];
        }
      });
      $('sample').addEventListener('click', () => {
        ui.source.value = SAMPLES[ui.language.value];
      });

      for (const tab of document.querySelectorAll('[role="tab"]')) {
        tab.addEventListener('click', () => showPane(tab.dataset.pane));
      }

      function showPane(name) {
        for (const tab of document.querySelectorAll('[role="tab"]')) {
          tab.setAttribute('aria-selected', String(tab.dataset.pane === name));
        }
        for (const pane of document.querySelectorAll('.pane')) {
          pane.dataset.active = String(pane.dataset.pane === name);
        }
      }

      function render(reply) {
        ui.rendered.textContent = reply.rendered || '(nothing reported)';
        ui.diagnostics.textContent = '';
        if (!reply.diagnostics.length) {
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = reply.ok ? 'No diagnostics.' : 'Failed, with nothing to report.';
          ui.diagnostics.append(li);
          return;
        }
        for (const d of reply.diagnostics) {
          const li = document.createElement('li');
          const severity = document.createElement('span');
          severity.className = `sev-${d.severity}`;
          severity.textContent = d.severity + (d.code ? ` ${d.code}` : '');
          li.append(severity, document.createTextNode(` ${d.message}`));
          if (d.file) {
            const where = document.createElement('div');
            where.className = 'where';
            where.textContent = `${d.file}:${d.line}:${d.column}`;
            li.append(where);
          }
          for (const note of d.notes ?? []) {
            const line = document.createElement('div');
            line.className = 'where';
            line.textContent = `note: ${note}`;
            li.append(line);
          }
          ui.diagnostics.append(li);
        }
      }

      function run(action) {
        if (!reticle) return;
        const language = ui.language.value;
        const name = language === 'vhdl' ? 'design.vhd' : 'design.v';
        const source = ui.source.value;
        let reply;
        let text = '';

        try {
          if (action === 'check') {
            reply = reticle.check(language, name, source);
            text = reply.ok ? reply.rtl ?? '' : '';
          } else if (action === 'synth') {
            reply = reticle.compile(language, name, source, {
              synth: true,
              format: ui.format.value,
            });
            text = reply.ok ? `${reply.report}\n${reply.output ?? ''}` : '';
          } else {
            reply = reticle.compile(language, name, source, {
              synth: false,
              format: ui.format.value,
            });
            text = reply.ok ? reply.output ?? '' : '';
          }
        } catch (error) {
          reply = { ok: false, rendered: `error: ${error.message}\n`, diagnostics: [] };
        }

        render(reply);
        ui.output.textContent = text || '(no output)';
        showPane(reply.ok && text ? 'output' : 'diagnostics');
      }

      $('check').addEventListener('click', () => run('check'));
      $('synth').addEventListener('click', () => run('synth'));
      $('emit').addEventListener('click', () => run('emit'));

      async function start(source) {
        try {
          reticle = await Reticle.load(source);
        } catch (error) {
          ui.meta.textContent = 'not loaded';
          ui.loaderMessage.textContent = error.message;
          ui.loader.hidden = false;
          return;
        }
        const features = reticle.features();
        ui.meta.textContent = `reticle ${reticle.version()} — ${features.join(', ') || 'no stages'}`;
        ui.loader.hidden = true;
        for (const button of ui.buttons) button.disabled = false;
        // A stage that is not in the build cannot be asked for.
        $('synth').disabled = !features.includes('synth');
        for (const [value, stage] of [
          ['verilog', 'verilog'],
          ['vhdl', 'vhdl'],
        ]) {
          const option = ui.language.querySelector(`option[value="${value}"]`);
          if (option) option.disabled = !features.includes(stage);
        }
      }

      ui.picker.addEventListener('change', () => {
        const file = ui.picker.files?.[0];
        if (file) start(file);
      });

      start('./reticle.wasm');
    </script>
  </body>
</html>
